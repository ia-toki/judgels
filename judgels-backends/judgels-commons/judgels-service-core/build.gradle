apply from: '../../gradle/java.gradle'

dependencies {
    api project(':judgels-commons:judgels-mapper')

    api "com.google.dagger:dagger:$daggerVersion"
    api "io.dropwizard:dropwizard-core:$dropwizardVersion"
    api "jakarta.inject:jakarta.inject-api:$jakartaInjectApiVersion"

    implementation "com.rabbitmq:amqp-client:$rabbitmqAmqpClientVersion"

    compileOnly "com.google.dagger:dagger-compiler:$daggerVersion"
    compileOnly "org.immutables:value-annotations:$immutablesVersion"

    annotationProcessor "com.google.dagger:dagger-compiler:$daggerVersion"
    annotationProcessor "org.immutables:value:$immutablesVersion"
}
